# Submits each tagged release to microsoft/winget-pkgs, so `winget install Memento`
# stays current with zero clicks. Two one-time prerequisites:
#   1. A classic PAT with the public_repo scope, saved as the WINGET_TOKEN repo secret.
#   2. The package must already exist in winget-pkgs; submit the first version once with
#      `wingetcreate new https://github.com/blancodagoat/memento/releases/download/v1.3.0/Memento.exe`
#      (id: blancodagoat.Memento). After that PR merges, this workflow handles every update.
# The rolling "latest" release is ignored: winget needs immutable versioned URLs.
name: winget

on:
  release:
    types: [published]

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: windows-latest
    steps:
      - name: Submit version update to winget-pkgs
        run: |
          if (-not "${{ secrets.WINGET_TOKEN }}") { Write-Host "WINGET_TOKEN secret not set; skipping submission."; exit 0 }
          $tag = "${{ github.event.release.tag_name }}"
          $version = $tag.TrimStart("v")
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe update blancodagoat.Memento --version $version `
            --urls "https://github.com/blancodagoat/memento/releases/download/$tag/Memento.exe" `
            --submit --token "${{ secrets.WINGET_TOKEN }}"
