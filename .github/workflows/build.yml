name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet run --project tests/BlancoShot.Tests

      - name: Publish (framework-dependent)
        run: dotnet publish src/BlancoShot/BlancoShot.csproj -c Release -p:SelfContained=false -o publish/framework-dependent

      - name: Publish (self-contained)
        run: dotnet publish src/BlancoShot/BlancoShot.csproj -c Release -o publish/self-contained

      - uses: actions/upload-artifact@v4
        with:
          name: BlancoShot
          path: publish/framework-dependent/BlancoShot.exe

      - uses: actions/upload-artifact@v4
        with:
          name: BlancoShot-self-contained
          path: publish/self-contained/BlancoShot.exe
