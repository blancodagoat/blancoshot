name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet run --project tests/BlancoShot.Tests

      - name: Publish
        run: dotnet publish src/BlancoShot/BlancoShot.csproj -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: BlancoShot
          path: src/BlancoShot/bin/Release/net10.0-windows/win-x64/publish/BlancoShot.exe
